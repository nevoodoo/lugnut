name: Feature request
description: Suggest something Lugnut should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like to see
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
