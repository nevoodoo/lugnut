name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7.6.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # the build script runs tsc --noEmit before vite build
      - run: npm run build

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7.6.0
      - run: npm ci --ignore-scripts && npm run build
        working-directory: frontend
      - run: uv build --wheel
      - name: Wheel contains the frontend
        run: unzip -l dist/*.whl | grep -q 'lugnut/static/index.html'
      - name: Install and start the wheel
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl
          export LUGNUT_DATA_DIR="$RUNNER_TEMP/data"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/lugnut" serve --port 8080 &
          trap 'kill $!' EXIT
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/api/health
      - uses: actions/upload-artifact@v5.0.0
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag lugnut:ci .

  upgrade:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7.6.0
      - uses: actions/download-artifact@v5.0.0
        with:
          name: wheel
          path: dist
      - run: python3 scripts/upgrade_check.py dist/*.whl

  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7.6.0
      - run: uvx zizmor@1.31.1 .github/workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4.9.0

  ci:
    if: always()
    needs: [python, frontend, package, docker, upgrade, workflows, dependency-review]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          ! echo "$RESULTS" | grep -Eq 'failure|cancelled'
