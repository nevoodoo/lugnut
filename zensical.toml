[project]
site_name = "Lugnut"
site_description = "A self-hosted vehicle maintenance and running-cost tracker"
site_url = "https://nevoodoo.github.io/lugnut/"
repo_url = "https://github.com/nevoodoo/lugnut"
repo_name = "nevoodoo/lugnut"
docs_dir = "docs-site"
site_dir = "site"
extra_css = ["stylesheets/brand.css"]
nav = [
  { "Home" = "index.md" },
  { "Install" = [
    { "Docker" = "install/docker.md" },
    { "Local" = "install/local.md" },
  ] },
  { "Coming from LubeLogger" = "coming-from-lubelogger.md" },
  { "Roadmap" = "roadmap.md" },
  { "Release notes" = "release-notes.md" },
  { "Contributing" = "contributing.md" },
]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true

[project.theme]
features = ["navigation.sections", "content.code.copy"]
